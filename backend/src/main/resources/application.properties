# =====================================================================
# P2P Payment Ledger - Application Configuration
# All secrets and environment-specific values are supplied via
# environment variables. Never hardcode credentials in this file.
#
# Required environment variables:
#   DB_URL        jdbc:postgresql://localhost:5432/payment_ledger
#   DB_USERNAME   e.g. postgres
#   DB_PASSWORD   your database password
#   JWT_SECRET    random secret, minimum 32 characters (256 bits)
# =====================================================================

# Application name
spring.application.name=payment-ledger

# =====================================================================
# DataSource - PostgreSQL
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_ledger
spring.datasource.username=postgres
spring.datasource.password=7008
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# DDL auto=update: Hibernate creates/alters schema automatically.
# Set to validate in production. Do not use Flyway (excluded per spec).
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Store all timestamps as UTC in the database
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================================
# JWT Configuration
# jwt.secret is sourced from the JWT_SECRET environment variable.
# jwt.expiration.ms = 86400000 = 24 hours in milliseconds.
# =====================================================================
jwt.secret=VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckpXVCE=
jwt.expiration.ms=86400000

# =====================================================================
# Spring Scheduler thread pool
# =====================================================================
spring.task.scheduling.pool.size=5

# =====================================================================
# Check Please - reservation expiry configuration
# min-hours: minimum allowed expiry duration from creation time (1 hour)
# max-days:  maximum allowed expiry duration from creation time (30 days)
# Both are configurable without code changes.
# =====================================================================
check.please.reservation.expiry.min-hours=1
check.please.reservation.expiry.max-days=30

# =====================================================================
# Server
# =====================================================================
server.port=8080
